name: release

# Builds the NeMo Guardrails server image from upstream source, scans and tests
# it, publishes it to GHCR, then packages and publishes the Helm chart.
#
# Chart.yaml is the source of truth for both versions:
#
#   version     the chart's own SemVer; the release tag is v<version>
#   appVersion  the upstream Guardrails version to build == the image tag
#
# Nothing is pushed unless the image passes the vulnerability gate and the chart
# installs and passes `helm test` with that exact image. The pushed image is the
# one that was scanned and tested, not a rebuild. A chart version that is
# already published is never overwritten.
#
# Trigger by pushing the tag for Chart.yaml's version (v1.0.0), or manually via
# workflow_dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish image and chart. Unchecked performs a dry run."
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Artifacts publish under <owner>/<repo>/ so they auto-link to this repository
  # and the origin is obvious from the pull command:
  #
  #   image  ghcr.io/<owner>/<repo>/nemo-guardrails:<appVersion>
  #   chart  ghcr.io/<owner>/<repo>/charts/nemo-guardrails:<version>
  #
  # There is no official image for the upstream *library* server, so this repo
  # builds one. Point REGISTRY at another registry if you have push rights.
  REGISTRY: ghcr.io
  IMAGE_NAME: nemo-guardrails
  UPSTREAM_REPO: NVIDIA-NeMo/Guardrails

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.v.outputs.chart_version }}
      app_version: ${{ steps.v.outputs.app_version }}
      publish: ${{ steps.v.outputs.publish }}
      image: ${{ steps.v.outputs.image }}
      chart_repo: ${{ steps.v.outputs.chart_repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          CHART_VERSION="$(yq '.version' Chart.yaml)"
          APP_VERSION="$(yq '.appVersion' Chart.yaml)"
          # Chart.yaml requires SemVer 2, and appVersion doubles as a git ref
          # and image tag.
          for v in "$CHART_VERSION" "$APP_VERSION"; do
            if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error file=Chart.yaml::'$v' is not a valid SemVer version"
              exit 1
            fi
          done
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "v$CHART_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Chart.yaml version $CHART_VERSION; push v$CHART_VERSION instead"
              exit 1
            fi
            PUBLISH=true
          else
            PUBLISH="$INPUT_PUBLISH"
          fi
          # GHCR paths must be lowercase.
          REPO_PATH="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          CHART_REPO="oci://$REGISTRY/$REPO_PATH/charts"
          if [ "$PUBLISH" = "true" ] \
            && helm show chart "$CHART_REPO/nemo-guardrails" --version "$CHART_VERSION" >/dev/null 2>&1; then
            echo "::error file=Chart.yaml::Chart $CHART_VERSION is already published; bump version in Chart.yaml"
            exit 1
          fi
          {
            echo "chart_version=$CHART_VERSION"
            echo "app_version=$APP_VERSION"
            echo "publish=$PUBLISH"
            echo "image=$REGISTRY/$REPO_PATH/$IMAGE_NAME"
            echo "chart_repo=$CHART_REPO"
          } >> "$GITHUB_OUTPUT"
          echo "Chart $CHART_VERSION | Guardrails $APP_VERSION | publish=$PUBLISH"

  image:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      APP_VERSION: ${{ needs.resolve.outputs.app_version }}
      IMAGE: ${{ needs.resolve.outputs.image }}
    steps:
      - name: Check out upstream NeMo Guardrails
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: v${{ needs.resolve.outputs.app_version }}
          path: upstream
          persist-credentials: false

      - name: Check out the chart
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: chart
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build into the local Docker daemon
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: upstream
          platforms: linux/amd64
          load: true
          tags: |
            ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.app_version }}
            ${{ needs.resolve.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=nemo-guardrails
            org.opencontainers.image.version=${{ needs.resolve.outputs.app_version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ env.UPSTREAM_REPO }}
            org.opencontainers.image.description=Unofficial build of the NVIDIA NeMo Guardrails API server, built from upstream source. Not published or supported by NVIDIA.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=Unofficial community build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0 # see "Security scanning" in the README before bumping
          cache: true

      # One full scan feeds the report and SBOM; the gate further down re-reads
      # the layer cache, so it is cheap. Code scanning is fed by security-scan,
      # which this workflow triggers once the release is published.
      - name: Scan for vulnerabilities and generate an SBOM
        run: |
          set -euo pipefail
          trivy image --scanners vuln --timeout 20m \
            --format json --output trivy-image.json "$IMAGE:$APP_VERSION"
          trivy convert --format cyclonedx --output sbom.cdx.json trivy-image.json
          trivy convert --format table --severity HIGH,CRITICAL trivy-image.json

      - name: Keep the scan report and SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: |
            trivy-image.json
            sbom.cdx.json
          if-no-files-found: ignore

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

      - name: Install the chart with this image and run helm test (restricted PSS)
        working-directory: chart
        run: |
          set -euo pipefail
          kind load docker-image "$IMAGE:$APP_VERSION" --name chart-testing
          kubectl create namespace guardrails
          kubectl label namespace guardrails pod-security.kubernetes.io/enforce=restricted
          helm install ci . \
            --namespace guardrails \
            --set image.repository="$IMAGE" \
            --set image.pullPolicy=Never \
            --wait --timeout 10m
          helm test ci --namespace guardrails

      - name: Dump diagnostics
        if: ${{ failure() }}
        run: |
          kubectl get all -n guardrails -o wide || true
          kubectl describe pods -n guardrails || true
          kubectl logs -n guardrails -l app.kubernetes.io/instance=ci --all-containers --tail=200 || true

      - name: Enforce the vulnerability policy
        run: |
          trivy image --scanners vuln --timeout 20m --skip-db-update \
            --ignore-unfixed --severity HIGH,CRITICAL \
            --ignorefile chart/.trivyignore.yaml \
            --exit-code 1 "$IMAGE:$APP_VERSION"

      - name: Log in to GHCR
        if: needs.resolve.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # appVersion tags are rebuilt on every chart release, which picks up
      # base-image security fixes; pin by digest if you need them immutable.
      - name: Push the tested image
        if: needs.resolve.outputs.publish == 'true'
        run: |
          set -euo pipefail
          docker push "$IMAGE:$APP_VERSION"
          docker push "$IMAGE:latest"

  chart:
    needs: [resolve, image]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      packages: write
    env:
      CHART_VERSION: ${{ needs.resolve.outputs.chart_version }}
      APP_VERSION: ${{ needs.resolve.outputs.app_version }}
      IMAGE: ${{ needs.resolve.outputs.image }}
      CHART_REPO: ${{ needs.resolve.outputs.chart_repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0 # see "Security scanning" in the README before bumping
          cache: true

      - name: Lint
        run: helm lint .

      - name: Scan the chart for misconfigurations
        run: |
          trivy config . \
            --ignorefile .trivyignore.yaml \
            --severity HIGH,CRITICAL \
            --exit-code 1

      - name: Package
        run: |
          set -euo pipefail
          helm package .
          ls -l ./*.tgz

      - name: Verify the packaged chart points at the published image
        run: |
          set -euo pipefail
          helm template verify "./nemo-guardrails-$CHART_VERSION.tgz" \
            | grep -q "image: \"$IMAGE:$APP_VERSION\""
          echo "Image reference verified."

      - name: Fetch the image scan report and SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-reports
          path: security-reports

      - name: Log in to GHCR
        if: needs.resolve.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GITHUB_TOKEN" \
            | helm registry login "$REGISTRY" -u "$ACTOR" --password-stdin

      - name: Push chart to GHCR (OCI)
        if: needs.resolve.outputs.publish == 'true'
        run: helm push "nemo-guardrails-$CHART_VERSION.tgz" "$CHART_REPO"

      - name: Create GitHub release
        if: needs.resolve.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.resolve.outputs.chart_version }}
          # Only used when a manual run creates the tag.
          target_commitish: ${{ github.sha }}
          name: v${{ needs.resolve.outputs.chart_version }}
          files: |
            nemo-guardrails-${{ needs.resolve.outputs.chart_version }}.tgz
            security-reports/sbom.cdx.json
            security-reports/trivy-image.json
          generate_release_notes: true
          body: |
            Chart `${{ needs.resolve.outputs.chart_version }}` for NeMo Guardrails `${{ needs.resolve.outputs.app_version }}`.

            **Image**
            ```
            ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.app_version }}
            ```

            **Install**
            ```bash
            helm install guardrails \
              ${{ needs.resolve.outputs.chart_repo }}/nemo-guardrails \
              --version ${{ needs.resolve.outputs.chart_version }} \
              --namespace guardrails --create-namespace
            ```

            **Security**
            `sbom.cdx.json` is the CycloneDX SBOM of the image and
            `trivy-image.json` the full Trivy report at build time. Current
            findings are under the repository's Security → Code scanning tab.

      # Refreshes code scanning with the images this release deploys instead of
      # waiting for the daily run.
      - name: Scan the published images
        if: needs.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run security-scan.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
