name: release

# Builds the NeMo Guardrails server image from upstream source, publishes it to
# GHCR, then packages and publishes the Helm chart at the same version.
#
#   Chart version == appVersion == image tag == upstream Guardrails version.
#
# Trigger by pushing a tag (v0.24.1), or manually via workflow_dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      guardrails_version:
        description: "Upstream NeMo Guardrails version to build (e.g. 0.24.1)"
        required: true
      publish:
        description: "Publish image and chart. Unchecked performs a dry run."
        type: boolean
        default: false

env:
  # Where the built image is published. There is no official image for the
  # upstream *library* server, so this repo builds one. Point REGISTRY and
  # IMAGE_NAMESPACE at an NVIDIA-owned registry instead if you have push rights.
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ""          # defaults to this repo's owner when empty
  IMAGE_NAME: nemo-guardrails
  UPSTREAM_REPO: NVIDIA-NeMo/Guardrails

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      image: ${{ steps.v.outputs.image }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH=true
          else
            VERSION="${{ inputs.guardrails_version }}"
            PUBLISH="${{ inputs.publish }}"
          fi
          # Chart.yaml requires SemVer 2.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid SemVer version"
            exit 1
          fi
          NS="${{ env.IMAGE_NAMESPACE }}"
          [ -n "$NS" ] || NS="${{ github.repository_owner }}"
          NS="$(printf '%s' "$NS" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$VERSION"
            echo "publish=$PUBLISH"
            echo "image=${{ env.REGISTRY }}/$NS/${{ env.IMAGE_NAME }}"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION | publish=$PUBLISH"

  image:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out upstream NeMo Guardrails
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: v${{ needs.resolve.outputs.version }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.resolve.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ needs.resolve.outputs.publish == 'true' }}
          tags: |
            ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.version }}
            ${{ needs.resolve.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=nemo-guardrails
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPO }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Unofficial build of the NVIDIA NeMo Guardrails API server, built from upstream source. Not published or supported by NVIDIA.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=Unofficial community build
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: [resolve, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint
        run: helm lint .

      - name: Package at the release version
        run: |
          set -euo pipefail
          helm package . \
            --version "${{ needs.resolve.outputs.version }}" \
            --app-version "${{ needs.resolve.outputs.version }}"
          ls -l ./*.tgz

      - name: Verify the packaged chart points at the published image
        run: |
          set -euo pipefail
          helm template verify ./nemo-guardrails-${{ needs.resolve.outputs.version }}.tgz \
            | grep -q "image: \"${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.version }}\""
          echo "Image reference verified."

      - name: Log in to GHCR
        if: needs.resolve.outputs.publish == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push chart to GHCR (OCI)
        if: needs.resolve.outputs.publish == 'true'
        run: |
          set -euo pipefail
          OWNER="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          helm push "nemo-guardrails-${{ needs.resolve.outputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/$OWNER/charts"

      - name: Create GitHub release
        if: needs.resolve.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve.outputs.version }}
          name: v${{ needs.resolve.outputs.version }}
          files: nemo-guardrails-${{ needs.resolve.outputs.version }}.tgz
          generate_release_notes: true
          body: |
            Chart `${{ needs.resolve.outputs.version }}` for NeMo Guardrails `${{ needs.resolve.outputs.version }}`.

            **Image**
            ```
            ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.version }}
            ```

            **Install**
            ```bash
            helm install guardrails \
              oci://ghcr.io/${{ github.repository_owner }}/charts/nemo-guardrails \
              --version ${{ needs.resolve.outputs.version }} \
              --namespace guardrails --create-namespace
            ```
