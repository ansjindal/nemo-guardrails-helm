name: security-scan

# Scans the container images the chart deploys for CVEs with Trivy, and uploads
# HIGH/CRITICAL findings to Security → Code scanning.
#
# - Daily, on demand, and after each release: the images the latest published
#   release deploys. CVEs keep being disclosed after release, so a clean scan
#   at build time does not stay clean. Fails on a fixable HIGH/CRITICAL
#   vulnerability that .trivyignore.yaml does not cover.
# - Pull requests: the images the PR's chart deploys. Uploading the same
#   categories as main lets code scanning compare the two, so its "Trivy" check
#   fails only on vulnerabilities the PR introduces, not on pre-existing ones.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      # The category drops the tag, so each image keeps a single code scanning
      # configuration across releases instead of leaving a stale one per tag.
      - id: images
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RENDERED="$(helm template scan .)"
          else
            # The published chart, not the working tree: main can already
            # reference newer images than the latest release deploys.
            CHART_VERSION="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName | ltrimstr("v")')"
            REPO_PATH="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            RENDERED="$(helm template scan "oci://ghcr.io/$REPO_PATH/charts/nemo-guardrails" --version "$CHART_VERSION")"
          fi
          IMAGES="$(printf '%s\n' "$RENDERED" \
            | sed -nE 's/^[[:space:]]*image:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' \
            | sort -u \
            | jq -Rcn '[inputs | {image: ., category: ("image:" + (sub("@.*$"; "") | sub(":[^:/]+$"; "")))}]')"
          echo "Scanning: $IMAGES"
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"

  scan:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0 # see "Security scanning" in the README before bumping
          cache: true

      - name: Scan
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          trivy image --scanners vuln --timeout 20m \
            --format json --output trivy.json "$IMAGE"
          trivy convert --format sarif --severity HIGH,CRITICAL --output trivy.sarif trivy.json
          trivy convert --format table --severity HIGH,CRITICAL trivy.json

      - name: Upload to GitHub code scanning
        if: ${{ !cancelled() && hashFiles('trivy.sarif') != '' && github.event.pull_request.head.repo.fork != true }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: ${{ matrix.category }}

      # On pull requests, code scanning's own check decides: it fails only on
      # alerts the PR introduces, so a CVE newly disclosed in an unchanged
      # image does not block unrelated PRs.
      - name: Enforce the vulnerability policy
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          trivy image --scanners vuln --timeout 20m --skip-db-update \
            --ignore-unfixed --severity HIGH,CRITICAL \
            --ignorefile .trivyignore.yaml \
            --exit-code 1 "$IMAGE"
