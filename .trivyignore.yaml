# Accepted findings for Trivy (see "Security scanning" in the README).
#
# vulnerabilities: accepted risk. Only the pass/fail gates read these entries;
# code scanning and the release report still show the finding. Every entry
# needs a statement and an expiry, so it is re-reviewed rather than silently
# accepted forever.
#
# misconfigurations: false positives for this chart. These are dropped from
# code scanning too, since there is nothing to act on.

vulnerabilities:
  # anyio 4.14.1 is pinned by the upstream uv.lock at v0.24.1. Bump tracked in
  # https://github.com/NVIDIA-NeMo/Guardrails/pull/2394; drop these entries
  # once a release ships anyio >= 4.14.2.
  - id: CVE-2026-63374
    purls:
      - pkg:pypi/anyio@4.14.1
    statement: >-
      IDNA 2003 hostname validation in connect_tcp/TLSStream.wrap. Only
      reachable for non-ASCII provider hostnames on a hijacked connection;
      configured endpoints are ASCII.
    expired_at: 2026-10-31
  - id: CVE-2026-63349
    purls:
      - pkg:pypi/anyio@4.14.1
    statement: >-
      extra_groups ignored by anyio.open_process. NeMo Guardrails does not
      import anyio itself or spawn processes through it.
    expired_at: 2026-10-31

misconfigurations:
  - id: KSV-0125
    statement: >-
      "Image from an untrusted registry": ghcr.io is not on Trivy's default
      allowlist, but it is where this repository publishes the image. Which
      registries a cluster trusts is its admission policy's decision.
  - id: KSV-0110
    statement: >-
      "Uses the default namespace": Trivy renders the chart without a
      namespace. Helm installs into the release namespace given at install time.
