apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "nemo-guardrails.fullname" . }}-test-connection"
  labels:
    {{- include "nemo-guardrails.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: curlimages/curl:8.11.1
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          BASE="http://{{ include "nemo-guardrails.fullname" . }}:{{ .Values.service.port }}"
          echo "==> GET /v1/health"
          curl -sf "$BASE/v1/health"
          echo
          echo "==> GET /v1/rails/configs"
          curl -sf "$BASE/v1/rails/configs"
          echo
          echo "All checks passed."
