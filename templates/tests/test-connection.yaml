apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "nemo-guardrails.fullname" . }}-test-connection"
  labels:
    {{- include "nemo-guardrails.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: curlimages/curl:8.22.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          BASE="http://{{ include "nemo-guardrails.fullname" . }}:{{ .Values.service.port }}"
          echo "==> GET /v1/health"
          curl -sf "$BASE/v1/health"
          echo
          echo "==> GET /v1/rails/configs"
          curl -sf "$BASE/v1/rails/configs"
          echo
          echo "All checks passed."
