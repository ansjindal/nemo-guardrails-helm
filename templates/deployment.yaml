apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nemo-guardrails.fullname" . }}
  labels:
    {{- include "nemo-guardrails.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nemo-guardrails.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.modelApiKeys (not .Values.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nemo-guardrails.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nemo-guardrails.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- include "nemo-guardrails.serverArgs" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          {{- if or .Values.modelApiKeys .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ include "nemo-guardrails.secretName" . }}
          {{- end }}
          env:
            - name: HOME
              value: {{ .Values.scratch.mountPath | quote }}
            - name: TMPDIR
              value: {{ .Values.scratch.mountPath | quote }}
            - name: CHAINLIT_APP_ROOT
              value: {{ .Values.scratch.mountPath | quote }}
            - name: FASTEMBED_CACHE_PATH
              value: {{ .Values.embeddingModelCache | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: scratch
              mountPath: {{ .Values.scratch.mountPath }}
            # Masks the example bots the upstream image bakes into /config;
            # they would otherwise be served, with this pod's provider keys,
            # alongside the configurations below.
            - name: configs
              mountPath: {{ .Values.server.configPath }}
            {{- range $id, $files := .Values.guardrailsConfigs }}
            - name: {{ printf "config-%s" $id | trunc 63 | trimSuffix "-" }}
              mountPath: {{ printf "%s/%s" $.Values.server.configPath $id }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: scratch
          {{- if .Values.scratch.sizeLimit }}
          emptyDir:
            sizeLimit: {{ .Values.scratch.sizeLimit }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: configs
          emptyDir:
            sizeLimit: 1Mi
        {{- range $id, $files := .Values.guardrailsConfigs }}
        - name: {{ printf "config-%s" $id | trunc 63 | trimSuffix "-" }}
          configMap:
            name: {{ include "nemo-guardrails.configMapName" (dict "root" $ "id" $id) }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
